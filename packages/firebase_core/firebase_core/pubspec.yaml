name: firebase_core
description: Flutter plugin for Firebase Core, enabling connecting to multiple
  Firebase apps.
homepage: https://firebase.google.com/docs/flutter/setup
repository: https://github.com/firebase/flutterfire/tree/main/packages/firebase_core/firebase_core
version: 4.10.0
publish_to: none
topics:
  - firebase
  - core

false_secrets:
  - example/**

environment:
  sdk: '^3.12.0'
  flutter: '>=3.44.0'

dependencies:
  firebase_core_platform_interface:
    git: https://github.com/kumsumit/firebase_core_platform_interface.git
  firebase_core_web:
    git: https://github.com/kumsumit/firebase_core_web.git
  flutter:
    sdk: flutter
  meta: ^1.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.7.0
  plugin_platform_interface:
    git: https://github.com/kumsumit/plugin_platform_interface.git

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.core
        pluginClass: FlutterFirebaseCorePlugin
      ios:
        pluginClass: FLTFirebaseCorePlugin
      macos:
        pluginClass: FLTFirebaseCorePlugin
      web:
        default_package: firebase_core_web
      windows:
        pluginClass: FirebaseCorePluginCApi

firebase:
  google_services_gradle_plugin_version: '4.4.4'
  crashlytics_gradle_plugin_version: '3.0.7'
  performance_gradle_plugin_version: '2.0.2'
