repository: https://github.com/firebase/flutterfire/tree/main/packages/flutterfire_internals
version: 1.3.72
publish_to: none

environment:
  sdk: '^3.12.0'
  flutter: '>=3.44.0'

dependencies:
  collection: ^1.19.1
